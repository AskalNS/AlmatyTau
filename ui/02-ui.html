<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATM — UI-макеты (этап 2)</title>
<style>
/* ============================================================
   ДИЗАЙН-ТОКЕНЫ  (соответствуют ui/01-DESIGN-SYSTEM.md)
   ============================================================ */
:root{
  --green-50:#EEF5F2; --green-100:#D6E7E0; --green-300:#7DB0A0;
  --green-600:#1B5648; --green-700:#14483C; --green-900:#08211C;
  --gold-500:#C8912F; --gold-700:#8A6220;
  --sky-500:#2B87B8;  --sky-700:#1F6A94;
  --s-0:#FFFFFF; --s-50:#F7F8F8; --s-100:#EFF1F1; --s-200:#E1E4E4;
  --s-300:#C7CCCB; --s-400:#9AA2A1; --s-500:#6E7876; --s-600:#4E5654;
  --s-700:#363C3B; --s-800:#232827; --s-900:#141817;
  --r-card:8px; --r-btn:6px;
  --sh-1:0 1px 2px rgba(20,24,23,.06);
  --sh-2:0 8px 24px rgba(20,24,23,.10);
  --disp:"Manrope","Segoe UI",system-ui,sans-serif;
  --text:"Inter","Segoe UI",system-ui,sans-serif;
  --wrap:1280px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--text);font-size:17px;line-height:1.7;color:var(--s-900);background:var(--s-100);display:flex}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;margin:0;line-height:1.15;letter-spacing:-.015em}
a{color:var(--green-600)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--green-600);outline-offset:2px}

/* ---------- оболочка прототипа ---------- */
aside{width:238px;flex:none;background:var(--s-900);color:#c9cdcc;height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 0;font-size:13px}
aside h1{font-size:13px;color:#fff;margin:0 16px 3px;font-family:var(--text);font-weight:600}
aside .sb{font-size:11px;color:#7c8482;margin:0 16px 16px;line-height:1.45}
aside .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6b7371;margin:16px 16px 5px}
aside a{display:block;padding:7px 16px;color:#c9cdcc;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
aside a:hover{background:#1e2322}
aside a.on{background:#1e2322;border-left-color:var(--gold-500);color:#fff}
main{flex:1;min-width:0}
.tb{background:#fff;border-bottom:1px solid var(--s-200);padding:9px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:50;font-size:13px}
.tb b{font-family:var(--text)}
.tb .sp{flex:1}
.tb button{font:inherit;font-size:12px;padding:5px 12px;border:1px solid var(--s-200);background:#fff;border-radius:6px;cursor:pointer;color:var(--s-700)}
.tb button.on{background:var(--s-900);color:#fff;border-color:var(--s-900)}
.view{padding:22px;overflow-x:hidden}
.dev{background:#fff;margin:0 auto;max-width:var(--wrap);box-shadow:var(--sh-2);transition:max-width .2s}
body.mob .dev{max-width:390px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 48px}
body.mob .wrap{padding:0 20px}

/* ============================================================
   КОМПОНЕНТЫ САЙТА
   ============================================================ */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--text);font-size:15px;font-weight:600;
  padding:12px 24px;border-radius:var(--r-btn);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:.15s}
.btn-p{background:var(--green-600);color:#fff}
.btn-p:hover{background:var(--green-700)}
.btn-s{background:#fff;color:var(--green-700);border-color:var(--s-300)}
.btn-s:hover{border-color:var(--green-600)}
.btn-g{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-g:hover{background:rgba(255,255,255,.12)}
.btn-sm{padding:8px 16px;font-size:14px}

.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:4px 12px;border-radius:999px;background:var(--green-50);color:var(--green-700)}
.tag-g{background:#FBF3E3;color:var(--gold-700)}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gold-700);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold-500)}

/* --- шапка --- */
.hdr{background:#fff;border-bottom:1px solid var(--s-200);position:relative;z-index:20}
.hdr .top{border-bottom:1px solid var(--s-100);font-size:13px;color:var(--s-500)}
.hdr .top .wrap{display:flex;align-items:center;gap:18px;height:38px}
.hdr .top .sp{flex:1}
.lang{display:flex;gap:2px}
.lang span{padding:2px 8px;border-radius:4px;cursor:pointer;font-weight:500}
.lang span.on{background:var(--green-600);color:#fff}
.a11y-btn{display:flex;align-items:center;gap:6px;color:var(--s-600);text-decoration:none}
.hdr .main .wrap{display:flex;align-items:center;gap:36px;height:76px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--s-900);flex:none}
.logo .mk{width:36px;height:36px;flex:none}
.logo .nm{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.15;letter-spacing:-.02em}
.logo .nm small{display:block;font-family:var(--text);font-weight:500;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--s-500)}
.nav{display:flex;gap:28px;font-size:15px;font-weight:500}
.nav a{color:var(--s-700);text-decoration:none;padding:26px 0;position:relative;white-space:nowrap}
.nav a.on{color:var(--green-700);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--gold-500)}
.nav a.dd::after{content:" ▾";font-size:10px;color:var(--s-400)}
.hdr .main .sp{flex:1}
.burger{display:none;font-size:22px;color:var(--s-700)}
body.mob .nav{display:none}
body.mob .burger{display:block;margin-left:auto}
body.mob .hdr .main .wrap{height:62px}

/* --- горы (CSS-иллюстрация вместо фото) --- */
.mtn{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#1a4f6b 0%,#2e7ea3 38%,#7db8cf 66%,#cfe4e6 100%)}
.mtn i{position:absolute;bottom:0;left:0;right:0;display:block}
.m1{height:62%;background:#3f6f7a;clip-path:polygon(0 62%,13% 28%,24% 47%,38% 12%,52% 40%,66% 20%,80% 44%,92% 26%,100% 50%,100% 100%,0 100%)}
.m2{height:50%;background:#2b5560;clip-path:polygon(0 70%,10% 42%,22% 60%,34% 30%,47% 55%,60% 34%,74% 58%,88% 38%,100% 62%,100% 100%,0 100%)}
.m3{height:36%;background:#173b42;clip-path:polygon(0 78%,14% 52%,28% 70%,42% 44%,56% 66%,70% 48%,84% 68%,100% 54%,100% 100%,0 100%)}
.snow{position:absolute;bottom:0;left:0;right:0;height:62%;
  background:linear-gradient(180deg,rgba(255,255,255,.85) 0 4%,transparent 14%);
  clip-path:polygon(0 62%,13% 28%,24% 47%,38% 12%,52% 40%,66% 20%,80% 44%,92% 26%,100% 50%,100% 100%,0 100%)}
.cable{position:absolute;top:22%;left:0;right:0;height:1px;background:rgba(255,255,255,.4);transform:rotate(-4deg)}
.cable::after{content:"";position:absolute;left:38%;top:-5px;width:16px;height:10px;background:rgba(255,255,255,.6);border-radius:2px}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,33,28,.62) 0%,rgba(8,33,28,.22) 42%,rgba(8,33,28,.78) 100%)}

/* --- герой --- */
.hero{position:relative;min-height:600px;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
body.mob .hero{min-height:440px}
.hero .wrap{position:relative;z-index:2;padding-top:90px;padding-bottom:60px}
.hero h1{font-size:60px;font-weight:800;max-width:15ch;text-shadow:0 2px 20px rgba(0,0,0,.3)}
body.mob .hero h1{font-size:34px}
.hero p{font-size:20px;max-width:52ch;color:rgba(255,255,255,.9);margin:20px 0 32px}
body.mob .hero p{font-size:17px}
.hero .eyebrow{color:#F0D08A}
.hero .eyebrow::before{background:var(--gold-500)}
.play{position:absolute;right:48px;bottom:60px;z-index:2;display:flex;align-items:center;gap:11px;
  color:#fff;font-size:13px;background:rgba(255,255,255,.13);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 18px 9px 10px}
.play b{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--green-700);
  display:grid;place-items:center;font-size:10px}
body.mob .play{display:none}

/* --- секции --- */
.sec{padding:96px 0}
body.mob .sec{padding:56px 0}
.sec.alt{background:var(--s-50)}
.sec h2{font-size:32px;margin-bottom:16px}
body.mob .sec h2{font-size:24px}
.lead{font-size:20px;color:var(--s-600);max-width:62ch}
body.mob .lead{font-size:17px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px}
body.mob .head{flex-direction:column;align-items:flex-start;gap:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
body.mob .grid2,body.mob .grid3,body.mob .grid4{grid-template-columns:1fr;gap:24px}

/* --- показатели --- */
.stat{border-top:3px solid var(--gold-500);padding-top:20px}
.stat b{display:block;font-family:var(--disp);font-size:46px;font-weight:800;
  line-height:1;letter-spacing:-.03em;color:var(--green-700);font-variant-numeric:tabular-nums}
body.mob .stat b{font-size:36px}
.stat span{display:block;font-size:15px;color:var(--s-600);margin-top:10px}

/* --- карточка новости --- */
.card{background:#fff;border:1px solid var(--s-200);border-radius:var(--r-card);
  overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-3px)}
.card .im{aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--green-100)}
.card .bd{padding:22px;flex:1;display:flex;flex-direction:column;gap:10px}
.card .dt{font-size:13px;color:var(--s-500);font-variant-numeric:tabular-nums}
.card h3{font-size:19px;line-height:1.35}
.card h3 a{color:inherit;text-decoration:none}
.card p{margin:0;font-size:15px;color:var(--s-600);line-height:1.6}

/* --- строка документа --- */
.doc{display:flex;align-items:center;gap:18px;padding:18px 20px;background:#fff;
  border:1px solid var(--s-200);border-radius:var(--r-card);margin-bottom:10px;transition:.15s}
.doc:hover{border-color:var(--green-300)}
.doc .ico{width:42px;height:52px;flex:none;border-radius:4px;background:var(--green-50);
  border:1px solid var(--green-100);display:grid;place-items:center;
  font-size:10px;font-weight:700;color:var(--green-700);letter-spacing:.03em}
.doc .in{flex:1;min-width:0}
.doc .in b{display:block;font-weight:600;font-size:16px;margin-bottom:3px}
.doc .in span{font-size:13px;color:var(--s-500)}
body.mob .doc{flex-wrap:wrap}

/* --- формы --- */
.fld{margin-bottom:16px}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;
  border:1px solid var(--s-300);border-radius:var(--r-btn);background:#fff;font-family:var(--text)}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--green-600);outline-offset:0;border-color:var(--green-600)}

/* --- подвал --- */
.ftr{background:var(--green-900);color:#a9bdb6;font-size:15px;padding:64px 0 0}
.ftr h4{color:#fff;font-family:var(--text);font-size:14px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px}
.ftr a{color:#a9bdb6;text-decoration:none;display:block;padding:5px 0}
.ftr a:hover{color:#fff}
.ftr .btm{border-top:1px solid rgba(255,255,255,.12);margin-top:52px;padding:22px 0;
  font-size:13px;color:#7d938c;display:flex;gap:20px;flex-wrap:wrap}
.ftr .btm .sp{flex:1}

/* --- стайлгайд --- */
.sg{padding:44px 48px;max-width:1180px;margin:0 auto;background:#fff}
.sg section{margin-bottom:56px}
.sg h2{font-size:24px;margin-bottom:6px}
.sg .cap{color:var(--s-500);font-size:15px;margin-bottom:24px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.sw div{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--s-200)}
.sw div i{display:block;height:72px}
.sw div p{margin:0;padding:9px 11px;font-size:12px;line-height:1.5}
.sw div p b{display:block;font-family:ui-monospace,monospace;font-size:11px;color:var(--s-500);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--s-200)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--s-500);font-weight:600}
.ok{color:#1f6b4a;font-weight:600}
.no{color:#a8322a;font-weight:600}
.warn{background:#FDF8EC;border-left:3px solid var(--gold-500);padding:14px 18px;
  font-size:14px;line-height:1.6;border-radius:0 var(--r-card) var(--r-card) 0;margin:18px 0}

/* --- режим для слабовидящих --- */
.a11y{background:#000;color:#FFE600;font-size:22px;line-height:1.85}
.a11y .bar2{border-bottom:3px solid #FFE600;padding:18px 32px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.a11y .bar2 span{border:2px solid #FFE600;padding:6px 14px}
.a11y .ct{padding:32px;max-width:900px}
.a11y h1{font-size:40px;margin-bottom:20px;color:#FFE600}
.a11y .alt{border:3px dashed #FFE600;padding:18px;margin:22px 0}
</style>
</head>
<body>

<aside>
  <h1>UI-макеты</h1>
  <div class="sb">ТОО «Almaty Tau Management»<br>Этап 2 приёмки · п. XIV ТЗ</div>
  <div id="menu"></div>
</aside>

<main>
  <div class="tb">
    <b id="t">—</b><span class="sp"></span>
    <button id="bD" class="on">Desktop</button>
    <button id="bM">Mobile</button>
  </div>
  <div class="view"><div class="dev" id="dev"></div></div>
</main>

<script>
/* =============== общие фрагменты =============== */
const MARK = `<svg class="mk" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <path d="M2 32 L13 12 L20 24 L27 8 L38 32 Z" fill="#14483C"/>
  <path d="M27 8 L31.4 16 L22.6 16 Z" fill="#fff"/>
  <path d="M13 12 L16.2 17.7 L9.8 17.7 Z" fill="#fff"/>
  <circle cx="20" cy="35.5" r="2.2" fill="#C8912F"/>
</svg>`;

const NAV=[['Главная','home'],['Almaty Tau Management','',1],['Проект АГК',''],
           ['Корпоративная информация','',1],['Медиацентр','news',1],['Контакты','contacts']];

function hdr(cur){return `<header class="hdr">
  <div class="top"><div class="wrap">
    <span>г. Алматы, ул. Байзакова 303</span><span class="sp"></span>
    <a class="a11y-btn" href="#">◐ Версия для слабовидящих</a>
    <span>⌕ Поиск</span>
    <div class="lang"><span>ҚАЗ</span><span class="on">РУС</span><span>ENG</span></div>
  </div></div>
  <div class="main"><div class="wrap">
    <a class="logo" href="#">${MARK}<span class="nm">ALMATY TAU<br>MANAGEMENT<small>Алматинский горный кластер</small></span></a>
    <nav class="nav">${NAV.map(([n,k,d])=>`<a href="#" class="${k===cur?'on':''}${d?' dd':''}">${n}</a>`).join('')}</nav>
    <span class="burger">☰</span>
  </div></div>
</header>`}

function ftr(){return `<footer class="ftr"><div class="wrap">
  <div class="grid4">
    <div>
      <a class="logo" href="#" style="color:#fff;margin-bottom:18px">${MARK}
        <span class="nm" style="color:#fff">ALMATY TAU<br>MANAGEMENT<small style="color:#7d938c">Оператор проекта АГК</small></span></a>
      <p style="font-size:14px;line-height:1.7;margin:0">Официальный сайт оператора проекта «Алматинский горный кластер».</p>
    </div>
    <div><h4>Компания</h4><a href="#">О компании</a><a href="#">Правление</a>
      <a href="#">Наблюдательный совет</a><a href="#">Организационная структура</a></div>
    <div><h4>Информация</h4><a href="#">Проект АГК</a><a href="#">Внутренние документы</a>
      <a href="#">Государственные закупки</a><a href="#">Вакансии</a></div>
    <div><h4>Контакты</h4>
      <p style="margin:0 0 10px;font-size:14px;line-height:1.7">г. Алматы,<br>ул. Байзакова 303, 2 этаж</p>
      <a href="#">+7 (727) 000-00-00</a><a href="#">info@atm.kz</a>
      <p style="font-size:13px;color:#7d938c;margin:10px 0 0">Пн–Пт, 09:00–18:00</p></div>
  </div>
  <div class="btm"><span>© 2026 ТОО «Almaty Tau Management»</span><span class="sp"></span>
    <a href="#" style="display:inline">Политика конфиденциальности</a>
    <a href="#" style="display:inline">Карта сайта</a></div>
</div></footer>`}

function mtn(cable){return `<div class="mtn">
  <i class="m1"></i><i class="snow"></i><i class="m2"></i><i class="m3"></i>
  ${cable?'<div class="cable"></div>':''}</div><div class="veil"></div>`}

/* =============== экраны =============== */
const S={};

S.style={t:'Дизайн-система',grp:'Основа',html:()=>`<div class="sg">
  <section>
    <div class="eyebrow">Этап 2 · UI</div>
    <h2 style="font-size:34px">Дизайн-система</h2>
    <p class="cap" style="font-size:18px;max-width:70ch">Брендбук Заказчиком не предоставлен.
      Палитра выведена из ландшафта Заилийского Алатау: тянь-шаньская ель, камень, снег,
      рассветное золото на вершинах. Каждый цвет проверен на контраст по WCAG 2.1.</p>
  </section>

  <section>
    <h2>Цвет</h2><p class="cap">Основная — Tau Green. Акцент — Sun Gold. Дополнительный — Sky.</p>
    <div class="sw">
      ${[['#EEF5F2','green-50','Фон секций'],['#D6E7E0','green-100','Границы'],
         ['#7DB0A0','green-300','Декор'],['#1B5648','green-600','Основной'],
         ['#14483C','green-700','Ховер, шапка'],['#08211C','green-900','Подвал'],
         ['#C8912F','gold-500','Только декор'],['#8A6220','gold-700','Акцентный текст'],
         ['#2B87B8','sky-500','Инфографика'],['#1F6A94','sky-700','Внешние ссылки'],
         ['#141817','stone-900','Основной текст'],['#6E7876','stone-500','Вторичный текст']]
        .map(([c,n,u])=>`<div><i style="background:${c}"></i><p><b>${n}</b>${u}<br><b>${c}</b></p></div>`).join('')}
    </div>
    <div class="warn"><b>Жёсткое правило.</b> <code>gold-500</code> никогда не используется как цвет
      текста на светлом фоне — контраст 2.8:1 не проходит WCAG. Только заливка, подчёркивание, иконка.
      Для текста акцентом существует <code>gold-700</code> (5.5:1). Это самая частая ошибка
      в подобных палитрах, и она сразу валит аудит доступности по п. VI ТЗ.</div>
  </section>

  <section>
    <h2>Контраст</h2><p class="cap">Вычислено по формуле WCAG 2.1. Норма: 4.5:1 для текста, 3:1 для крупного.</p>
    <table><thead><tr><th>Пара</th><th>Коэффициент</th><th>Вердикт</th></tr></thead><tbody>
      ${[['#141817 на белом — основной текст','17.9 : 1','AAA',1],
         ['#1B5648 на белом — ссылки и кнопки','8.5 : 1','AAA',1],
         ['Белый на #1B5648 — текст на кнопке','8.5 : 1','AAA',1],
         ['#1F6A94 на белом — внешние ссылки','5.9 : 1','AA',1],
         ['#8A6220 на белом — акцентный текст','5.5 : 1','AA',1],
         ['#141817 на #C8912F — тёмный по золоту','6.7 : 1','AA',1],
         ['#C8912F на белом','2.8 : 1','не для текста',0]]

const ORDER=['style','home','news','newsItem','docs','contacts','a11y'];
const menu=document.getElementById('menu');let last=null;
ORDER.forEach(k=>{const s=S[k];
  if(s.grp&&s.grp!==last){last=s.grp;const g=document.createElement('div');g.className='grp';g.textContent=s.grp;menu.appendChild(g);}
  const a=document.createElement('a');a.dataset.k=k;a.textContent=s.t;a.onclick=()=>show(k);menu.appendChild(a);});
function show(k){document.getElementById('dev').innerHTML=S[k].html();
  document.getElementById('t').textContent=S[k].t;
  [...menu.querySelectorAll('a')].forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  scrollTo(0,0);location.hash=k;}
document.getElementById('bD').onclick=e=>{document.body.classList.remove('mob');e.target.classList.add('on');document.getElementById('bM').classList.remove('on')};
document.getElementById('bM').onclick=e=>{document.body.classList.add('mob');e.target.classList.add('on');document.getElementById('bD').classList.remove('on')};
show(ORDER.includes(location.hash.slice(1))?location.hash.slice(1):'style');
