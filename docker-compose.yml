# =============================================================================
#  ТОО «Almaty Tau Management» — боевое развёртывание
#
#    cp .env.example .env   и заполнить
#    docker compose up -d --build
#
#  Наружу торчит только nginx (80/443/8080). Postgres, Redis и MinIO портов
#  на хост не публикуют — они доступны лишь внутри сети compose.
#
#  Сегментация сети (после инцидента 20.08.2026, см. коммит про XMRig и
#  security-incidents/xmrig-incident-2026-08-20.txt):
#    - data (internal: true) — postgres/redis/minio; только backend и backup
#      имеют туда доступ. web/admin туда не входят: даже если их снова
#      скомпрометируют, как 20.08.2026, у них нет сетевого пути к БД/кешу/
#      хранилищу — только прикладной API backend'а.
#    - app (internal: true) — web/admin/backend/nginx общаются друг с другом
#      внутри compose, без доступа в интернет из web/admin/backend.
#    - public (без internal) — то, что реально ходит наружу само (backend
#      для SMTP, certbot для Let's Encrypt), и nginx — ВАЖНО: internal:true
#      блокирует NAT для сети целиком, включая входящий трафик через
#      опубликованные хостом порты, а не только исходящий, поэтому nginx
#      не может сидеть в одной только internal-сети. Раньше единственная
#      сеть internal не имела флага internal: true и молча пускала исходящий
#      трафик из ЛЮБОГО контейнера — вероятно, именно так во время
#      инцидента внутрь web докачался дроппер XMRig уже после RCE.
# =============================================================================

name: atm

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 384m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # C.UTF-8 — корректная сортировка казахских символов ә ғ қ ң ө ұ ү һ і
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data]

  # ------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 320m
    cpus: 0.3
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  # ------------------------------------------------------------------- MinIO
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    <<: *logging
    mem_limit: 384m
    cpus: 0.4
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${S3_PUBLIC_URL}/console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Также в app: nginx проксирует GET /media/ прямо в minio (см. atm.conf).
    # Отдаёт анонимно только префикс public/ (см. minio-init ниже) — то же
    # самое, что и так торчит наружу через nginx, доступ к data этим не даёт.
    networks: [data, app]

  # Разовая инициализация: создаёт бакет и открывает на чтение только
  # префикс /public/. Всё остальное отдаётся исключительно по ссылке от API.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    mem_limit: 64m
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET/public &&
      echo 'MinIO: бакет готов'
      "
    networks: [data]
    restart: "no"

  # ----------------------------------------------------------------- Backend
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    <<: *logging
    mem_limit: 384m
    cpus: 0.6
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      PORT: 4000
      # Swagger-документация API (/api/docs) — требование п. II ТЗ.
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      TOTP_ISSUER: ${TOTP_ISSUER}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      FEEDBACK_TO: ${FEEDBACK_TO}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      # Внутри сети compose — напрямую в контейнер web, минуя nginx и интернет.
      WEB_INTERNAL_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # data — БД/кеш/хранилище; app — web/nginx; public — только SMTP наружу.
    networks: [data, app, public]

  # --------------------------------------------------------------------- Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        ANALYTICS_ID: ${ANALYTICS_ID}
        MAPS_PROVIDER: ${MAPS_PROVIDER}
        MAPS_API_KEY: ${MAPS_API_KEY}
    restart: unless-stopped
    <<: *logging
    mem_limit: 320m
    cpus: 0.5
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      PORT: 3000
      # Внутри сети ходим напрямую в контейнер, минуя nginx и интернет
      API_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Ни data (нет пути к postgres/redis/minio), ни public (нет пути в
    # интернет) — самый исторически атакуемый контейнер (см. заголовок файла)
    # заперт внутри app и общается только с backend/nginx.
    networks: [app]

  # ------------------------------------------------------------------- Admin
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    <<: *logging
    mem_limit: 64m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Отдаёт только статику, никуда сама не ходит; API вызывается из браузера
    # через nginx, не из этого контейнера.
    networks: [app]

  # ------------------------------------------------------------------- Nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 96m
    cpus: 0.3
    depends_on:
      backend: { condition: service_healthy }
      web:     { condition: service_healthy }
      admin:   { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      # Временный доступ к админке по IP, пока нет своего домена под неё —
      # см. комментарий у admin-блока в infra/nginx/conf.d/atm.conf.
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # ВАЖНО: internal:true у сети блокирует NAT для этой сети целиком, включая
    # входящий трафик через опубликованные хостом порты — не только исходящий.
    # nginx должен быть в НЕinternal-сети, иначе порты 80/443/8080 наружу не
    # работают ни для чего вообще. public даёт входящую доступность, app —
    # приватный путь к web/admin/backend/minio.
    networks: [app, public]

  # ----------------------------------------------------------------- Certbot
  certbot:
    image: certbot/certbot:latest
    mem_limit: 64m
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Проверяет продление дважды в сутки — рекомендация Let's Encrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks: [public]

  # ----------------------------------------------- Резервные копии (п. XI ТЗ)
  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    <<: *logging
    mem_limit: 192m
    cpus: 0.3
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      TZ: ${TZ}
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
    volumes:
      # ТЗ требует хранить копии отдельно от основного сервера — этот путь
      # по умолчанию указывает на локальный диск ЭТОГО ЖЕ хоста, что этому
      # требованию не соответствует. Смонтируйте сюда сетевой диск (NFS/SMB)
      # или примонтированный бакет хостинг-провайдера (rclone mount / s3fs),
      # либо настройте выгрузку архивов за пределы сервера отдельным шагом.
      - ./backups:/backups
    networks: [data]

volumes:
  pgdata:
  redisdata:
  miniodata:
  certbot-conf:
  certbot-www:

networks:
  # БД, кеш и хранилище. web/admin сюда не входят ни при каких условиях.
  data:
    driver: bridge
    internal: true
  # Внутреннее общение web/admin/backend/nginx между собой, без интернета.
  app:
    driver: bridge
    internal: true
  # Только то, что реально должно ходить наружу как клиент: backend (SMTP)
  # и certbot (Let's Encrypt). НЕ internal.
  public:
    driver: bridge
