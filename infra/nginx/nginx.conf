# =============================================================================
#  Nginx — обратный прокси и точка входа (пп. VIII, X ТЗ)
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Реальный IP клиента за прокси — для логов и rate-limit бэкенда.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;                 # не раскрываем версию nginx
  client_max_body_size 512M;         # верхняя граница загрузки видео/файлов

  # --- Сжатие (п. VIII ТЗ) --------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/rss+xml font/woff2 image/svg+xml;

  # Brotli подключается, если модуль собран в образе. На стандартном
  # nginx:alpine его нет — тогда работает gzip выше. Для brotli используйте
  # образ с модулем (например, fholzer/nginx-brotli) и раскомментируйте:
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/css application/javascript application/json image/svg+xml;

  # --- Ограничение частоты запросов (п. X.II ТЗ) ----------------------------
  # Зоны: строгая для входа в админку, мягкая для остального API.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  # Общий лимит для фронтенда — до 20.08.2026 сюда прилетал неограниченный
  # поток сканирования (927 запросов за минуту с одного IP), см.
  # /root/security-incidents/xmrig-incident-2026-08-20.txt
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_status 429;

  # Определяем срок кэша по типу для статики фронтендов.
  map $sent_http_content_type $cache_control {
    default                    "public, max-age=0, must-revalidate";
    ~image/                    "public, max-age=2592000";
    ~font/                     "public, max-age=31536000, immutable";
    application/javascript     "public, max-age=31536000, immutable";
    text/css                   "public, max-age=31536000, immutable";
  }

  include /etc/nginx/conf.d/*.conf;
}
