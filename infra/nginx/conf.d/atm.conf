# =============================================================================
#  Сайты ATM: публичный сайт, админка, API.
#
#  Домены заменить на боевые. Блоки TLS раскомментировать после выпуска
#  сертификата (см. infra/README.md и команду certbot в корневом README).
# =============================================================================

# --- Общие заголовки безопасности (п. X ТЗ) ---------------------------------
# Подключаются в каждый server через include.
map $host $dummy_security { default 1; }

# Без явного default_server nginx отдаёт первый описанный ниже server-блок
# любому запросу с незнакомым Host (в том числе поддельным). Next.js кэширует
# ответы без учёта Host, поэтому один запрос с чужим Host мог отравить кэш
# редиректом на сторонний домен для всех последующих посетителей atm.kz —
# именно так сайт 20.08.2026 начал отдавать редирект на https://return.st/.
# Этот блок обрывает соединение для любого Host, кроме перечисленных ниже.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# ==================== Публичный сайт: atm.kz =================================
server {
  listen 80;
  # IP добавлен временно, пока нет домена (см. media-локацию ниже) — как
  # только atm.kz/www.atm.kz заработают по DNS, доступ по голому IP стоит убрать.
  server_name atm.kz www.atm.kz 154.59.110.127;

  # Проверка домена для Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # До выпуска сертификата сайт работает по HTTP. После — раскомментировать
  # редирект и перенести location в блок 443 ниже.
  # location / { return 301 https://$host$request_uri; }

  # Медиа из MinIO, пока нет отдельного домена media.atm.kz — доступ по IP.
  # S3_PUBLIC_URL=http://<ip>/media, бакет публичен только под /public/.
  location /media/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Оптимизированная отдача статики Next с длинным кэшем (п. VIII ТЗ)
  location /_next/static/ {
    proxy_pass http://web:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Браузерные вызовы API с того же домена (форма обратной связи, поиск).
  # Строгий лимит на вход — защита от перебора (п. X.II ТЗ).
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ==================== API: api.atm.kz ========================================
server {
  listen 80;
  server_name api.atm.kz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Строгий лимит на вход в систему — защита от перебора (п. X.II ТЗ)
  location /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }

  add_header X-Content-Type-Options nosniff always;
}

# ==================== Админка: admin.atm.kz =================================
server {
  listen 80;
  server_name admin.atm.kz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Админку правильно закрыть по IP офиса (п. X.II — ограничение доступа
  # к административной части). Раскомментируйте и укажите адреса:
  # allow 203.0.113.0/24;
  # deny all;

  # Вызовы API из админки (все операции управления контентом).
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }

  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Админка запрещена к индексации поисковиками.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
}
