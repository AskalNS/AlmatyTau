<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATM — UX-прототипы (этап 1)</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#1c1c1e; --mute:#6b6b70; --line:#c9c9cf; --bg:#f4f4f6;
    --panel:#fff; --accent:#2f5d50; --note:#8a6d1f; --noteBg:#fdf6e3;
  }
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}

  /* ---------- навигация по прототипу ---------- */
  aside{width:250px;flex:none;background:#22252a;color:#d7d9de;padding:16px 0;overflow-y:auto;height:100vh;position:sticky;top:0}
  aside h1{font-size:13px;margin:0 16px 4px;color:#fff;letter-spacing:.02em}
  aside .sub{font-size:11px;color:#8c9098;margin:0 16px 16px}
  aside .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#71757d;margin:18px 16px 6px}
  aside a{display:block;padding:6px 16px;color:#d7d9de;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
  aside a:hover{background:#2b2f35}
  aside a.on{background:#2b2f35;border-left-color:var(--accent);color:#fff}
  aside a .u{display:block;font-size:10px;color:#71757d;font-family:ui-monospace,monospace}

  /* ---------- рабочая область ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .bar .ttl{font-weight:600}
  .bar .url{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute);background:var(--bg);padding:2px 8px;border-radius:4px}
  .bar .sp{flex:1}
  .bar button{font:inherit;font-size:12px;padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  .bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stage{padding:24px;overflow-y:auto;flex:1}
  .frame{background:var(--panel);border:1px solid var(--line);margin:0 auto;max-width:1180px;transition:max-width .2s}
  body.mob .frame{max-width:390px}

  /* ---------- примитивы каркаса ---------- */
  .box{border:1px dashed var(--line);background:#fafafb;padding:14px;margin-bottom:12px}
  .box .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-bottom:8px}
  .ph{background:repeating-linear-gradient(45deg,#ececed,#ececed 8px,#e4e4e6 8px,#e4e4e6 16px);
      border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
      color:var(--mute);font-size:12px;text-align:center;padding:8px}
  .tx{height:9px;background:#e2e2e5;border-radius:2px;margin:7px 0}
  .tx.s{width:45%} .tx.m{width:72%} .tx.l{width:92%}
  .h{height:16px;background:#d3d3d8;border-radius:2px;width:55%;margin:0 0 12px}
  .btn{display:inline-block;border:1px solid var(--ink);padding:7px 16px;font-size:12px;border-radius:5px;margin-right:8px}
  .btn.f{background:var(--ink);color:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .g2,.g3,.g4{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  body.mob .g2,body.mob .g3,body.mob .g4{grid-template-columns:1fr}
  body.mob .row{flex-direction:column}
  .note{background:var(--noteBg);border-left:3px solid var(--note);padding:9px 12px;font-size:12px;color:#6b5512;margin:12px 0}
  .note b{color:#4a3a0a}
  .tag{display:inline-block;font-size:10px;background:#e8ecea;color:var(--accent);padding:2px 8px;border-radius:10px;margin-right:5px}

  /* ---------- шапка / подвал каркаса ---------- */
  .hd{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hd .logo{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .hd nav{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
  .hd nav span.cur{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}
  .hd .tools{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mute)}
  .hd .tools .ic{border:1px solid var(--line);border-radius:4px;padding:3px 7px}
  body.mob .hd nav{display:none}
  body.mob .hd .burger{display:block !important}
  .hd .burger{display:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;margin-left:auto}
  .crumb{padding:10px 20px;font-size:11px;color:var(--mute);border-bottom:1px solid #ededf0}
  .bd{padding:20px}
  .ft{border-top:1px solid var(--line);padding:18px 20px;background:#fafafb}
  .hero{height:280px}
  body.mob .hero{height:180px}
</style>
</head>
<body>

<aside>
  <h1>Прототипы UX</h1>
  <div class="sub">ТОО «Almaty Tau Management»<br>Этап 1 приёмки · п. XIV ТЗ</div>
  <div id="menu"></div>
</aside>

<main>
  <div class="bar">
    <span class="ttl" id="t">—</span>
    <span class="url" id="u">—</span>
    <span class="sp"></span>
    <button id="bD" class="on">Desktop</button>
    <button id="bM">Mobile</button>
  </div>
  <div class="stage"><div class="frame" id="frame"></div></div>
</main>

<script>
/* ---------------------------------------------------------------
   Каркасы страниц. Дизайн намеренно отсутствует — это этап 1 (UX).
   Визуальное оформление разрабатывается на этапе 2 (UI).
----------------------------------------------------------------*/

const NAV = ['Главная','Almaty Tau Management','Проект АГК','Корп. информация','Медиацентр','Контакты'];

function head(cur){
  return `<div class="hd">
    <div class="logo">◭ ALMATY TAU MANAGEMENT</div>
    <nav>${NAV.map(n=>`<span class="${n===cur?'cur':''}">${n}${['Almaty Tau Management','Корп. информация','Медиацентр'].includes(n)?' ▾':''}</span>`).join('')}</nav>
    <div class="burger">☰</div>
    <div class="tools">
      <span class="ic">⌕ поиск</span>
      <span class="ic">KK · <b>RU</b> · EN</span>
      <span class="ic">◐ слабовидящим</span>
    </div>
  </div>`;
}
function crumb(p){ return p ? `<div class="crumb">Главная / ${p}</div>` : ''; }
function foot(){
  return `<div class="ft">
    <div class="g4">
      <div><div class="tx s"></div><div class="tx m"></div><div class="tx m"></div><div class="tx s"></div></div>
      <div><div class="tx s"></div><div class="tx m"></div><div class="tx m"></div><div class="tx s"></div></div>
      <div><div class="tx s"></div><div class="tx m"></div><div class="tx m"></div></div>
      <div class="box" style="margin:0"><div class="lbl">Контакты</div>
        <div class="tx l"></div><div class="tx m"></div><div class="tx s"></div></div>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--mute)">
      © ATM · Политика конфиденциальности · Карта сайта · KK / RU / EN
    </div>
  </div>`;
}
function page(cur, path, body){ return head(cur)+crumb(path)+`<div class="bd">${body}</div>`+foot(); }

/* ------------------------------ экраны ------------------------------ */
const S = {};

S.home = { t:'Главная', u:'/ru', nav:'Главная', grp:'Публичный сайт', html:()=>page('Главная','',`

      <div style="margin-top:12px"><span class="btn f">О проекте</span><span class="btn">Новости</span></div></div>
    <div class="note"><b>Риск PageSpeed.</b> Видео — главная угроза LCP на мобильных (п. VIII: Mobile ≥ 80).
      Решение: LCP-элемент — постер-изображение, видео грузится после <code>load</code>;
      на мобильных вместо видео статичный кадр. Требует подтверждения Заказчика.</div>
  </div>

  <div class="box"><div class="lbl">Секция 2 · О проекте «Алматинский горный кластер»</div>
    <div class="row"><div><div class="h"></div><div class="tx l"></div><div class="tx l"></div><div class="tx m"></div>

  </div>

  </div>

    <div class="ph" style="height:230px">Интерактивная карта территории АГК<br><small>задел под цифровой двойник (п. VI)</small></div>
  </div>

    <div class="g4">${'<div class="ph" style="height:56px">логотип</div>'.repeat(4)}</div>
  </div>

  <div class="note"><b>Порядок и состав секций редактируются</b> из админки без разработчика —
    п. IV ТЗ разрешает Заказчику менять структуру на любом этапе.</div>
`)};

S.company = { t:'Обзор раздела «Almaty Tau Management»', u:'/ru/company', nav:'Almaty Tau Management', html:()=>page('Almaty Tau Management','Almaty Tau Management',`
  <div class="h" style="width:45%"></div><div class="tx l"></div><div class="tx m"></div>

    имел уникальный URL. Родительский пункт с выпадающим списком без своей страницы недоступен
    с клавиатуры и теряет уровень в SEO.</div>
`)};

`)};

`)};

S.person = { t:'Карточка персоны', u:'/ru/company/board/[slug]', nav:'Almaty Tau Management', html:()=>page('Almaty Tau Management','… / Правление / Персона',`

`)};

S.vacancy = { t:'Вакансия', u:'/ru/corporate/vacancies/[slug]', nav:'Корп. информация', html:()=>page('Корп. информация','… / Вакансии / Вакансия',`
  <div class="h" style="width:58%"></div>
  <div class="row"><span class="tag">подразделение</span><span class="tag">срок приёма</span><span class="tag">условия</span></div>

/* ------------------------------ роутер ------------------------------ */
const ORDER = ['home','company','about','board','person','structure','project','corporate','documents',
  'procurement','vacancies','vacancy','media','news','newsItem','gallery','album','contacts','search',
  'a11y','notfound','adminNews','adminMenu'];

const menu=document.getElementById('menu'); let last=null;
ORDER.forEach(k=>{
  const s=S[k];
  if(s.grp && s.grp!==last){ last=s.grp;
    const g=document.createElement('div'); g.className='grp'; g.textContent=s.grp; menu.appendChild(g); }
  const a=document.createElement('a'); a.dataset.k=k;
  a.innerHTML=`${s.t}<span class="u">${s.u}</span>`;
  a.onclick=()=>show(k); menu.appendChild(a);
});

function show(k){
  const s=S[k];
  document.getElementById('frame').innerHTML=s.html();
  document.getElementById('t').textContent=s.t;
  document.getElementById('u').textContent=s.u;
  [...menu.querySelectorAll('a')].forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  document.querySelector('.stage').scrollTop=0;
  location.hash=k;
}
document.getElementById('bD').onclick=()=>{document.body.classList.remove('mob');
  document.getElementById('bD').classList.add('on');document.getElementById('bM').classList.remove('on')};
document.getElementById('bM').onclick=()=>{document.body.classList.add('mob');
  document.getElementById('bM').classList.add('on');document.getElementById('bD').classList.remove('on')};

show(ORDER.includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
