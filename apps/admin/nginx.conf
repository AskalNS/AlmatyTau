# Отдача SPA админки. Все маршруты возвращают index.html — роутинг
# на стороне React Router.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Проксируем API на бэкенд, чтобы админка работала как самодостаточный
  # контейнер (прямой доступ на свой порт при локальном тестировании).
  # В бою запрос к admin.<домен>/api перехватывает внешний nginx раньше.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 512M;
  }

  # Ассеты с хэшем в имени — иммутабельны, кэшируем надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA-фолбэк: любой путь → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html не кэшируем — иначе после деплоя пользователь получит старую
  # версию со ссылками на исчезнувшие ассеты.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
}
