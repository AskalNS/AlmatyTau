# =============================================================================
#  Инфраструктура для локальной разработки.
#
#  Поднимает только Postgres, Redis и MinIO — приложения запускаются
#  на хосте через `pnpm dev`, чтобы работал hot reload.
#
#      docker compose -f docker-compose.dev.yml up -d
#
#  Порты публикуются на localhost. Пароли простые: наружу это не смотрит.
#  Для боевого развёртывания используется docker-compose.yml.
# =============================================================================

name: atm-dev

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm
      POSTGRES_DB: atm
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Almaty
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm -d atm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass atm --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata-dev:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atmadmin
      MINIO_ROOT_PASSWORD: atmadmin123
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # веб-консоль: http://localhost:9001
    volumes:
      - miniodata-dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 atmadmin atmadmin123 &&
      mc mb --ignore-existing local/atm-media &&
      mc anonymous set download local/atm-media/public &&
      echo 'MinIO готов: бакет atm-media'
      "
    restart: "no"

  # Просмотр писем при разработке: форма обратной связи и приглашения
  # пользователей никуда не уходят, а видны на http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # веб-интерфейс

volumes:
  pgdata-dev:
  redisdata-dev:
  miniodata-dev:
